name: CI

on:
  # push：直推 main 也要跑质量门禁。此前只有 pull_request 触发器，
  # 导致直推 main 完全绕过 lint/typecheck/test（而 deploy.yml 会在同一次
  # push 上直接部署），真实缺陷因此在 main 上长期存活。
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

env:
  # 构建与类型检查都依赖 @theme alias 指向真实主题目录。
  # 缺失时 vite 会因 ENOENT 失败，tsc 会报 "Cannot find module '@theme'"。
  # 与 deploy.yml 的 vars.THEME 保持一致，此处显式声明以免 CI 依赖仓库变量。
  THEME: xinghui

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Setup Wrangler Config
        run: cp wrangler.example.jsonc wrangler.jsonc

      - name: Lint Check
        run: bun lint

      - name: Compile Paraglide Runtime
        run: bun run i18n:compile

      - name: Type Check
        run: bun tsc --noEmit

      - name: Run Node Tests
        run: bun run test:node

      - name: Run Integration Tests
        run: bun run test

      - name: Build
        run: bun run build

