name: deploy to cloudflare workers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".agent/**"
      - ".vscode/**"
      - ".gitignore"
  workflow_dispatch:

jobs:
  # 部署前置质量门禁。
  #
  # 此前 deploy 是 push main 后的第一个也是唯一的作业，job 内没有任何
  # test/lint/typecheck —— 坏代码直达生产。更糟的是 package.json 的
  # deploy 脚本是 `bun db:migrate && wrangler deploy`，即构建失败时
  # 迁移已经跑过生产库了。
  #
  # 这里刻意不写 `needs: quality` 引用 ci.yml（跨 workflow 的 needs 不被
  # 支持），而是把最小必要校验内联进来：类型检查 + 测试 + 构建。
  # 任何一步失败，deploy 作业不会开始，生产不受影响。
  quality:
    name: Pre-deploy Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Setup Wrangler Config
        run: cp wrangler.example.jsonc wrangler.jsonc

      - name: Compile Paraglide Runtime
        run: bun run i18n:compile

      - name: Lint Check
        run: bun lint

      - name: Type Check
        run: bun tsc --noEmit

      - name: Run Node Tests
        run: bun run test:node

      - name: Run Integration Tests
        run: bun run test

  deploy:
    name: Deploy
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      # === Original repo: fetch secrets from Vault ===
      - name: "[Vault] Import cloudflare secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/cloudflare *

      - name: "[Vault] Import runtime secrets"
        if: github.repository == 'du2333/flare-stack-blog'
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.dukda.com
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            secrets/data/blog *

      # === Fork repos: use repository secrets ===
      - name: "[Fork] Import secrets from repository"
        if: github.repository != 'du2333/flare-stack-blog'
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "D1_DATABASE_ID=${{ secrets.D1_DATABASE_ID }}" >> $GITHUB_ENV
          echo "KV_NAMESPACE_ID=${{ secrets.KV_NAMESPACE_ID }}" >> $GITHUB_ENV
          echo "BUCKET_NAME=${{ secrets.BUCKET_NAME }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}" >> $GITHUB_ENV
          echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL }}" >> $GITHUB_ENV
          echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}" >> $GITHUB_ENV
          echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}" >> $GITHUB_ENV
          echo "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_PURGE_API_TOKEN=${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}" >> $GITHUB_ENV
          echo "DOMAIN=${{ secrets.DOMAIN }}" >> $GITHUB_ENV
          echo "CDN_DOMAIN=${{ secrets.CDN_DOMAIN }}" >> $GITHUB_ENV
          echo "UMAMI_SRC=${{ secrets.UMAMI_SRC }}" >> $GITHUB_ENV
          echo "VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}" >> $GITHUB_ENV
          echo "PAGEVIEW_SALT=${{ secrets.PAGEVIEW_SALT }}" >> $GITHUB_ENV
          echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}" >> $GITHUB_ENV
          echo "THEME=${{ vars.THEME }}" >> $GITHUB_ENV
          echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> $GITHUB_ENV

      - name: Inject Resource IDs
        run: |
          ROUTE="${ROUTE:-${{ vars.ROUTE }}}"
          ZONE_NAME="${ZONE_NAME:-${{ vars.ZONE_NAME }}}"
          export ROUTE
          export ZONE_NAME
          bun run wrangler:prepare

      - name: Generate Secrets JSON
        run: |
          cat <<EOF > secrets.json
          {
            "BETTER_AUTH_SECRET": "$BETTER_AUTH_SECRET",
            "BETTER_AUTH_URL": "$BETTER_AUTH_URL",
            "ADMIN_EMAIL": "$ADMIN_EMAIL",
            "GITHUB_CLIENT_ID": "$GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET": "$GITHUB_CLIENT_SECRET",
            "CLOUDFLARE_ZONE_ID": "$CLOUDFLARE_ZONE_ID",
            "CLOUDFLARE_PURGE_API_TOKEN": "$CLOUDFLARE_PURGE_API_TOKEN",
            "DOMAIN": "$DOMAIN",
            "CDN_DOMAIN": "$CDN_DOMAIN",
            "VITE_UMAMI_WEBSITE_ID": "$VITE_UMAMI_WEBSITE_ID",
            "UMAMI_SRC": "$UMAMI_SRC",
            "PAGEVIEW_SALT": "$PAGEVIEW_SALT",
            "TURNSTILE_SECRET_KEY": "$TURNSTILE_SECRET_KEY",
            "GITHUB_TOKEN": "$GITHUB_TOKEN"
          }
          EOF

      - name: Deploy to Cloudflare Workers
        run: |
          bun run build
          bun run deploy
          bunx wrangler secret bulk secrets.json

      - name: Purge Cloudflare CDN Cache
        run: |
          PURGE_DOMAIN=${CDN_DOMAIN:-$DOMAIN}
          echo "Purging CDN cache for $PURGE_DOMAIN"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_PURGE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["'$PURGE_DOMAIN'"]}'
          echo ""
